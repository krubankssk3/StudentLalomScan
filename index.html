<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จดหมายข่าวประชาสัมพันธ์ - โรงเรียนบ้านละลม</title>
<link rel="preload" as="image" href="logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{
  --bg:#F1F5F9; --card:#FFFFFF; --border:#E2E8F0;
  --primary:#1E40AF; --primary-light:#3B82F6;
  --success:#059669; --warning:#B45309; --danger:#DC2626;
  --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(15,23,42,0.06);
  --shadow-lg:0 10px 40px rgba(15,23,42,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--text);
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.display{font-family:'Prompt',sans-serif}
.container{max-width:1100px;margin:0 auto;padding:0 16px}


/* สถานะกำลังโหลดแบบเบา - จางลงเล็กน้อย + แถบวิ่งด้านบน */
#gridContainer.is-loading{opacity:.45;transition:opacity .15s;pointer-events:none}
.top-progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#1E40AF,#3B82F6,#EF4444);z-index:300;transition:width .25s ease;opacity:0}
.top-progress.show{opacity:1}
/* ===== Effect ค่อย ๆ ปรากฏ ===== */
body{opacity:0;animation:pageIn .55s ease forwards}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-up{opacity:0;animation:fadeUp .5s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{opacity:0;animation:fadeUp .45s ease forwards}

/* ===== Loader วงแหวน ฟ้า-แดง + โลโก้ ===== */
.swal2-popup.nl-swal{border-radius:16px;font-family:'Sarabun',sans-serif}
.swal2-popup.nl-swal .swal2-title{font-family:'Prompt',sans-serif;font-size:17px;color:#0F172A}
.swal2-popup.nl-swal .swal2-html-container{font-size:13px;color:#64748B}

.nl-ring svg{width:100%;height:100%;animation:nlspin 1.05s linear infinite;display:block}
/* Loader แบบไม่มีกล่องขาว - พื้นหลังเบลอ */
.swal2-popup.nl-plain{background:transparent!important;box-shadow:none!important;padding:0!important;width:auto!important}
.swal2-container.nl-blur{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:rgba(15,23,42,.34)!important}
.swal2-popup.nl-plain .swal2-html-container{margin:0!important;padding:0!important;overflow:visible!important}
.nl-ring{position:relative;width:132px;height:132px;margin:0 auto}
.nl-ring-logo{position:absolute;inset:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:7px;box-shadow:0 6px 22px rgba(0,0,0,.28)}

@keyframes nlspin{to{transform:rotate(360deg)}}

.nl-ring-logo img{width:100%;height:100%;object-fit:contain}
.nl-ring-logo .fallback{font-size:26px}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}

/* ===== Header ===== */
.header{background:var(--card);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:50}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;padding:3px}
.brand-logo img{width:100%;height:100%;object-fit:contain}
/* โลโก้: ซ่อนไว้จนโหลดเสร็จ แล้วค่อยจางเข้ามา (กันเห็นรูปแตกระหว่างรอ) */
.logo-box{position:relative}
.logo-box img{opacity:0;transition:opacity .12s ease}
.logo-box img.loaded{opacity:1}
.logo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60%;color:#94A3B8;background:linear-gradient(100deg,#F1F5F9 30%,#E2E8F0 50%,#F1F5F9 70%);background-size:200% 100%;animation:phShimmer 1.3s linear infinite;border-radius:50%}
@keyframes phShimmer{to{background-position:-200% 0}}
.logo-box img.loaded + .logo-ph{display:none}

.brand-title{font-size:16px;font-weight:600}
.brand-sub{font-size:11px;color:var(--text-2)}
.btn-admin{padding:8px 14px;font-size:13px;background:var(--primary);color:#fff;border-radius:var(--radius-sm);display:flex;align-items:center;gap:5px;transition:.2s}
.btn-admin:hover{background:#1a3a9c}

/* ===== Hero Featured ===== */
.hero{background:linear-gradient(135deg,#1E40AF 0%,#3B82F6 100%);border-radius:14px;margin:18px 0;overflow:hidden;position:relative;color:#fff;min-height:240px}
/* รูปแบนเนอร์เป็นพื้นหลังเต็มผืน (จาง) */
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
/* overlay น้ำเงินทับรูป ให้ตัวอักษรเด่น - เข้มฝั่งซ้าย จางฝั่งขวา */
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,rgba(30,64,175,0.94) 0%,rgba(30,64,175,0.82) 42%,rgba(37,99,235,0.55) 72%,rgba(59,130,246,0.38) 100%)}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent);border-radius:50%;z-index:2}
.hero-grid{display:block;position:relative;z-index:3}
.hero-body{padding:30px 32px;max-width:640px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;margin-bottom:12px;backdrop-filter:blur(4px)}
.hero-title{font-size:24px;font-weight:700;margin-bottom:8px;line-height:1.3;text-shadow:0 2px 12px rgba(15,23,42,0.4)}
.hero-excerpt{font-size:13px;opacity:.92;margin-bottom:18px;line-height:1.6;text-shadow:0 1px 8px rgba(15,23,42,0.3);max-width:520px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-white{padding:9px 18px;background:#fff;color:var(--primary);border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;transition:.2s}
.btn-white:hover{transform:translateY(-1px)}
.btn-ghost{padding:9px 18px;background:rgba(255,255,255,0.18);color:#fff;border:0.5px solid rgba(255,255,255,0.4);border-radius:var(--radius-sm);font-size:13px;display:flex;align-items:center;gap:5px;transition:.2s;backdrop-filter:blur(4px)}
.btn-ghost:hover{background:rgba(255,255,255,0.28)}
.hero-img-wrap{display:none}

/* ===== Stats Strip ===== */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;align-items:center;gap:10px}
.stat-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat-label{font-size:10px;color:var(--text-2)}
.stat-val{font-size:16px;font-weight:600}

/* ===== Filters ===== */
.search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;padding:10px 14px;border:0.5px solid #CBD5E1;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--card)}
.search-box:focus{outline:none;border-color:var(--primary)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;background:var(--card);border:0.5px solid #CBD5E1;color:#475569;border-radius:20px;font-size:12.5px;transition:.2s}
.chip:hover{border-color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.toolbar-info{font-size:13px;color:#475569}
.toolbar-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.toolbar-controls select{font-size:12px;padding:5px 8px;border:0.5px solid #CBD5E1;border-radius:6px;background:var(--card);font-family:inherit}
.toolbar-controls .lbl{font-size:11px;color:var(--text-2)}

/* ===== Card Grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-badge{position:absolute;top:8px;right:8px;z-index:2;color:#fff;font-size:9px;padding:3px 9px;border-radius:10px;font-weight:600}
.card-badge.hot{background:rgba(220,38,38,0.95)}
.card-badge.popular{background:rgba(245,158,11,0.95)}
.card-cover{height:100px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-cover img{width:100%;height:100%;object-fit:cover}
.card-cat{position:absolute;bottom:6px;left:6px;background:rgba(255,255,255,0.95);font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600}
.card-body{padding:11px 13px}
.card-title{font-weight:600;font-size:13px;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-excerpt{font-size:11px;color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.card-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);border-top:0.5px solid #F1F5F9;padding-top:6px}

/* ===== Pagination ===== */
.pagination{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:20px}
.pg-btn{min-width:32px;height:32px;padding:0 8px;background:var(--card);border:0.5px solid #CBD5E1;color:#475569;border-radius:6px;font-size:12px;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:.2s}
.pg-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.pg-btn:disabled{background:#F1F5F9;color:#CBD5E1;cursor:not-allowed}

/* ===== Loading / Empty ===== */
.loading,.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,25,0.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;overflow:hidden;box-shadow:var(--shadow-lg);position:relative;animation:modalIn .3s ease;max-height:92vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:6px}
.modal-close button{width:32px;height:32px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#475569;font-size:16px;transition:.2s}
.modal-close button:hover{background:#fff}
.modal-hero{height:150px;background:linear-gradient(135deg,#1E40AF,#3B82F6);position:relative;overflow:hidden}
.modal-hero img{width:100%;height:100%;object-fit:cover}
.modal-hero-overlay{position:absolute;inset:0;background:linear-gradient(transparent,rgba(15,23,42,0.55))}
.modal-hero-text{position:absolute;bottom:14px;left:20px;right:20px;color:#fff;z-index:1}
.modal-hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.25);padding:3px 10px;border-radius:20px;font-size:10px;margin-bottom:6px}
.modal-hero-title{font-size:19px;font-weight:600;line-height:1.3}
.modal-meta{display:flex;gap:14px;padding:11px 20px;border-bottom:0.5px solid var(--border);font-size:11px;color:var(--text-2);flex-wrap:wrap}
.modal-body{padding:16px 20px}
.modal-content-text{font-size:13px;color:#475569;line-height:1.75;margin-bottom:16px;white-space:pre-wrap}
.pdf-box{background:linear-gradient(135deg,#EFF6FF,#F5F3FF);border:0.5px solid #DBEAFE;border-radius:var(--radius-sm);padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pdf-ico{width:44px;height:44px;background:linear-gradient(135deg,#EF4444,#DC2626);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.pdf-info{flex:1;min-width:0}
.pdf-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-size{font-size:10px;color:var(--text-2)}
.pdf-actions{display:flex;gap:6px;flex-shrink:0}
.btn-sm{padding:7px 12px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:4px;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#1E40AF,#3B82F6);color:#fff}
.btn-outline{background:#fff;border:0.5px solid #CBD5E1;color:#475569}
.btn-primary:hover,.btn-outline:hover{transform:translateY(-1px)}
.modal-section-label{font-size:11px;color:var(--text-3);margin-bottom:6px}
.pdf-viewer{width:100%;height:400px;border:0.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:14px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:#F1F5F9;color:#475569;padding:3px 10px;border-radius:12px;font-size:10px}
.qr-section{display:flex;align-items:center;gap:14px;background:#F8FAFC;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:4px}
.qr-box{width:90px;height:90px;background:#fff;border-radius:8px;padding:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.qr-box img,.qr-box canvas{width:100%;height:100%}
/* รูป preview ใน modal */
.img-preview-box{background:#F8FAFC;border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;text-align:center}
.img-preview{max-width:100%;max-height:300px;border-radius:8px;cursor:zoom-in;margin:0 auto;transition:.2s}
.img-preview:hover{opacity:.9}
.img-preview-hint{font-size:10px;color:var(--text-3);margin:6px 0 8px}
.img-dl-btn{display:inline-flex}
/* QR grid 2 แบบ */
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.qr-card{background:#F8FAFC;border-radius:var(--radius-sm);padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center}
.qr-card .qr-box{margin-bottom:8px}
.qr-card .qr-title{font-size:11px;font-weight:600;margin-bottom:2px}
.qr-card .qr-desc{font-size:9px;color:var(--text-2);line-height:1.4}
/* แกลเลอรีรูปหลายรูป */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.gallery-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:zoom-in;border:0.5px solid var(--border)}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:.2s}
.gallery-item:hover img{transform:scale(1.06)}
.gallery-zoom{position:absolute;inset:0;background:rgba(15,23,42,0.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;opacity:0;transition:.2s}
.gallery-item:hover .gallery-zoom{opacity:1}
@media(max-width:680px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}

/* lightbox ดูรูปเต็ม */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:95%;border-radius:8px}
.lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.qr-text{flex:1}
.qr-title{font-size:12px;font-weight:600;margin-bottom:2px}
.qr-desc{font-size:10px;color:var(--text-2);line-height:1.5}
.modal-nav{display:flex;gap:6px;padding-top:12px;border-top:0.5px solid var(--border)}
.modal-nav button{flex:1;padding:9px;background:#fff;border:0.5px solid #CBD5E1;border-radius:var(--radius-sm);font-size:11px;color:#475569;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;transition:.2s}
.modal-nav button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.modal-nav button:disabled{opacity:.4;cursor:not-allowed}

/* ===== Footer ===== */
.footer{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 100%);padding:26px 0;color:#fff;position:relative;overflow:hidden;margin-top:20px}
.footer::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(59,130,246,0.15),transparent);border-radius:50%}
.footer-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px}
.footer-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.footer-logo{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;padding:5px}
.footer-logo img{width:100%;height:100%;object-fit:contain}
.footer-dev-label{font-size:10px;color:var(--primary-light);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:4px}
.footer-dev-name{font-size:15px;font-weight:600}
.footer-dev-role{font-size:11px;color:#CBD5E1;line-height:1.6;margin-top:4px}
.footer-bottom{border-top:0.5px solid rgba(255,255,255,0.1);margin-top:18px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.footer-copy{font-size:10px;color:var(--text-2)}
.footer-ver{font-size:10px;color:var(--text-2)}

/* ===== Responsive ===== */
@media(max-width:680px){
  .hero-grid{grid-template-columns:1fr}
  .hero-img-wrap{display:none}
  .hero-body{padding:20px}
  .hero-title{font-size:19px}
  .stats-strip{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .modal-meta{gap:10px}
  .pdf-viewer{height:300px}
  .footer-top{flex-direction:column;text-align:center}
  .qr-grid{grid-template-columns:1fr}
}
@media(max-width:400px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top-progress" id="topProgress"></div>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo logo-box"><img id="brandLogo" src="logo.png" alt="" fetchpriority="high"><div class="logo-ph" style="font-size:22px">🏫</div></div>
      <div>
        <div class="brand-title display" id="schoolName">จดหมายข่าวประชาสัมพันธ์</div>
        <div class="brand-sub" id="schoolSub">โรงเรียน · เขตพื้นที่</div>
      </div>
    </div>
    <a class="btn-admin" id="adminLink"><i class="ti ti-shield-lock"></i> สำหรับผู้ดูแล</a>
  </div>
</header>

<main class="container">
  <!-- Hero Featured -->
  <section id="heroSection"></section>

  <!-- Stats -->
  <section class="stats-strip" id="statsStrip"></section>

  <!-- Search + Filter -->
  <div class="search-row">
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 ค้นหาจดหมายข่าว...">

<script src="config.js"></script>
<script>
// ============================================================
//  State
// ============================================================
const State = {
  page: 1,
  pageSize: CONFIG.ITEMS_PER_PAGE,
  category: 'all',
  search: '',
  sort: 'latest',
  categories: [],
  currentList: [],
  pagination: null
};

const catColorMap = {}; // map categoryId -> {name,color,icon}

// ============================================================
//  ระบบแจ้งเตือน / โหลดข้อมูล (SweetAlert2 + วงแหวนฟ้า-แดง)
// ============================================================
function ringHtml(){
  return `
  <div class="nl-ring">
    <svg viewBox="0 0 120 120">
      <defs>
        <linearGradient id="nlgrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E40AF"/>
          <stop offset="45%" stop-color="#3B82F6"/>
          <stop offset="75%" stop-color="#EF4444"/>
          <stop offset="100%" stop-color="#DC2626"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="52" fill="none" stroke="#EEF2F7" stroke-width="9"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="url(#nlgrad)" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="215 327"/>
    </svg>
    <div class="nl-ring-logo">
      <img src="${CONFIG.LOGO_URL}" alt="โลโก้" onerror="this.parentNode.innerHTML='<span class=&quot;fallback&quot;>🏫</span>'">
    </div>
  </div>`;
}

// แถบโหลดบาง ๆ ด้านบนจอ (ใช้ตอนเปลี่ยนหน้า/ค้นหา - ไม่บังหน้าจอ)
const Bar = {
  _t:null,
  start(){
    const b=document.getElementById('topProgress'); if(!b) return;
    clearTimeout(this._t);
    b.classList.add('show'); b.style.width='0';
    requestAnimationFrame(()=>{ b.style.width='70%'; });
    const g=document.getElementById('gridContainer'); if(g) g.classList.add('is-loading');
  },
  done(){
    const b=document.getElementById('topProgress'); if(!b) return;
    b.style.width='100%';
    this._t=setTimeout(()=>{ b.classList.remove('show'); b.style.width='0'; },260);
    const g=document.getElementById('gridContainer'); if(g) g.classList.remove('is-loading');
  }
};

const NL = {
  // แสดงหน้าจอกำลังโหลด
  _timer: null,
  _shown: false,
  // แสดงวงแหวนโหลด - จะขึ้นก็ต่อเมื่อโหลดนานเกิน 200ms
  // (ถ้าข้อมูลมาไว จะไม่เห็น loader เลย ไม่ต้องรอเก้อ)
  loading(){
    if(!window.Swal) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(()=>{
      if(Swal.isVisible()) return;
      this._shown = true;
      Swal.fire({
        html: ringHtml(),
        customClass:{popup:'nl-plain', container:'nl-blur'},
        background:'transparent',
        backdrop:false,
        allowOutsideClick:false, allowEscapeKey:false, showConfirmButton:false,
        showClass:{popup:'', backdrop:''},
        hideClass:{popup:'', backdrop:''}
      });
    }, 200);
  },
  close(){
    clearTimeout(this._timer);
    if(window.Swal && this._shown){ Swal.close(); this._shown=false; }
    else if(window.Swal && Swal.isVisible()){ Swal.close(); }
  },
  toast(msg, icon){
    if(!window.Swal) return;
    Swal.fire({
      toast:true, position:'bottom', timer:2600, showConfirmButton:false,
      icon: icon||'success', title: msg,
      customClass:{popup:'nl-swal'}
    });
  },
  error(msg){
    if(!window.Swal){ alert(msg); return; }
    Swal.fire({icon:'error',title:'เกิดข้อผิดพลาด',text:msg,confirmButtonColor:'#1E40AF',customClass:{popup:'nl-swal'}});
  }
};

// ============================================================
//  API helpers
// ============================================================
async function apiGet(action, params){
  const url = new URL(CONFIG.API_URL);
  url.searchParams.set('action', action);
  Object.keys(params||{}).forEach(k=>url.searchParams.set(k, params[k]));
  const res = await fetch(url.toString());
  return res.json();
}

// ============================================================
//  Init
// ============================================================

// ===== โลโก้ =====
// ที่อยู่รูปถูกใส่ไว้ใน HTML แล้ว (src="logo.png") เบราว์เซอร์จึงเริ่มโหลด
// ตั้งแต่วินาทีแรกที่อ่านหน้า - เร็วที่สุด ไม่ต้องรอ JS
// ฟังก์ชันนี้แค่คอยดูแล: โหลดเสร็จ = แสดงผล / โหลดไม่ได้ = ใช้ลิงก์สำรองใน config
function setLogos(ids){
  const remote = CONFIG.LOGO_URL || '';
  ids.forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    if(el.complete && el.naturalWidth) el.classList.add('loaded');   // มาถึงก่อน JS แล้ว
    el.addEventListener('load', ()=>el.classList.add('loaded'));
    el.addEventListener('error', function(){
      if(remote && this.src.indexOf('logo.png')!==-1){ this.src=remote; }  // ถอยไปใช้ลิงก์สำรอง
      else { this.style.display='none'; }                                   // ปล่อยให้ 🏫 แสดงแทน
    });
  });
  // ล้าง cache เก่าที่ไม่ใช้แล้ว
  try{ localStorage.removeItem('nl_logo_cache_v1'); localStorage.removeItem('nl_logo_cache_v2'); }catch(e){}
}

async function init(){
  // ใส่ค่าคงที่จาก config
  setLogos(['brandLogo','footerLogo']);
  // ใช้โลโก้โรงเรียนเป็นไอคอนบนแท็บเบราว์เซอร์
  const fav=document.getElementById('favIcon'); if(fav && CONFIG.LOGO_URL) fav.href=CONFIG.LOGO_URL;
  document.getElementById('schoolSub').textContent = CONFIG.SCHOOL_NAME + ' · ' + CONFIG.SCHOOL_DISTRICT;
  document.getElementById('adminLink').href = CONFIG.ADMIN_URL;
  document.getElementById('devName').textContent = CONFIG.DEVELOPER;
  document.getElementById('devRole').innerHTML = CONFIG.DEVELOPER_ROLE + '<br>' + CONFIG.DEVELOPER_DISTRICT;
  document.getElementById('footerCopy').textContent = '© ' + (new Date().getFullYear()+543) + ' ระบบจดหมายข่าวประชาสัมพันธ์ · พัฒนาด้วย Google Apps Script';
  document.getElementById('footerVer').innerHTML = '<i class="ti ti-version"></i> ' + CONFIG.VERSION;

  NL.loading();
  // โหลดหมวดหมู่ก่อน (ต้องใช้สร้างสี/ชื่อหมวด)
  await loadCategories();
  // ที่เหลือโหลดพร้อมกันทีเดียว - เร็วกว่าโหลดทีละอย่างมาก
  await Promise.all([ loadStatsAndFeatured(), loadList(true) ]);
  NL.close();

  bindEvents();
}

async function loadCategories(){
  try{
    const r = await apiGet('categories');
    if(r.success){
      State.categories = r.data;
      r.data.forEach(c=>catColorMap[c.id]={name:c.name,color:c.color,icon:c.icon});
      renderChips();
    }
  }catch(e){ console.error('โหลดหมวดหมู่ไม่สำเร็จ', e); }
}

function renderChips(){
  const total = State.categories.reduce((s,c)=>s+c.count,0);
  let html = `<button class="chip ${State.category==='all'?'active':''}" data-cat="all">ทั้งหมด ${total}</button>`;
  State.categories.forEach(c=>{
    html += `<button class="chip ${State.category===c.id?'active':''}" data-cat="${c.id}">${c.icon} ${c.name} ${c.count}</button>`;
  });
  document.getElementById('categoryChips').innerHTML = html;
}

async function loadFeatured(){
  try{
    const r = await apiGet('list',{featured:'true',pageSize:1,status:'published'});
    const hero = document.getElementById('heroSection');
    if(r.success && r.data.length>0){
      hero.innerHTML = renderHero(r.data[0]);
    }else{
      hero.innerHTML = '';
    }
  }catch(e){ console.error(e); }
}

function renderHero(item){
  const cat = catColorMap[item.category] || {name:'',icon:''};
  // รูปแบนเนอร์เป็นพื้นหลังเต็มผืน (ถ้ามี) + overlay น้ำเงินจาง
  const bg = item.coverImageUrl
    ? `<img class="hero-bg" src="${item.coverImageUrl}" alt="" style="object-position:${item.coverPos||'50% 50%'}"><div class="hero-overlay"></div>`
    : '';
  return `
  <div class="hero fade-up">
    ${bg}
    <div class="hero-grid">
      <div class="hero-body">
        <div class="hero-badge"><i class="ti ti-star-filled" style="color:#FCD34D"></i> เด่นประจำสัปดาห์</div>
        <div class="hero-title display">${esc(item.title)}</div>
        <div class="hero-excerpt">${esc(item.excerpt)}...</div>
        <div class="hero-actions">
          <button class="btn-white" onclick="openModal('${item.id}')"><i class="ti ti-eye"></i> อ่านทั้งหมด</button>
          ${item.hasPdf?`<button class="btn-ghost" onclick="downloadPdf('${item.id}',event)"><i class="ti ti-download"></i> ดาวน์โหลด PDF</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

async function loadStatsAndFeatured(){
  // ดึงรายการทั้งหมดครั้งเดียว แล้วใช้ทั้งทำสถิติและหาฉบับเด่น (ลดการเรียก API)
  try{
    const r = await apiGet('list',{pageSize:9999,status:'published'});
    if(!r.success) return;
    const items = r.data;

    // --- ฉบับเด่น ---
    const hero = document.getElementById('heroSection');
    const feat = items.find(i=>i.isFeatured);
    hero.innerHTML = feat ? renderHero(feat) : '';

    const totalViews = items.reduce((s,i)=>s+(i.viewCount||0),0);
    const totalDl = items.reduce((s,i)=>s+(i.downloadCount||0),0);
    // นับใหม่ในสัปดาห์นี้
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
    const newThisWeek = items.filter(i=>new Date(i.publishedAt||i.createdAt)>weekAgo).length;

    document.getElementById('statsStrip').innerHTML = `
      ${statCard('#DBEAFE','#1E40AF','ti-news','ทั้งหมด',items.length+' ฉบับ')}
      ${statCard('#D1FAE5','#059669','ti-flame','ใหม่สัปดาห์นี้',newThisWeek+' ฉบับ')}
      ${statCard('#EDE9FE','#7C3AED','ti-eye','ยอดดูรวม',totalViews.toLocaleString())}
      ${statCard('#FEF3C7','#B45309','ti-download','ดาวน์โหลด',totalDl.toLocaleString())}
    `;
  }catch(e){ console.error(e); }
}
function statCard(bg,fg,ico,label,val){
  return `<div class="stat"><div class="stat-ico" style="background:${bg};color:${fg}"><i class="ti ${ico}"></i></div>
    <div><div class="stat-label">${label}</div><div class="stat-val">${val}</div></div></div>`;
}

async function loadList(quiet){
  if(!quiet) Bar.start();
  const grid = document.getElementById('gridContainer');
  try{
    const r = await apiGet('list',{
      page:State.page, pageSize:State.pageSize, category:State.category,
      search:State.search, sort:State.sort, status:'published'
    });
    if(!r.success){ grid.innerHTML=`<div class="empty">เกิดข้อผิดพลาด: ${r.error}</div>`; return; }
    State.currentList = r.data;
    State.pagination = r.pagination;
    renderGrid(r.data);
    renderPagination(r.pagination);
    updateToolbar(r.pagination);
    Bar.done();
  }catch(e){
    Bar.done();
    grid.innerHTML=`<div class="empty"><i class="ti ti-wifi-off" style="font-size:32px"></i><br>เชื่อมต่อไม่สำเร็จ<br><span style="font-size:12px">ตรวจสอบ API_URL ใน config.js</span></div>`;
    console.error(e);
  }
}

function renderGrid(items){
  if(items.length===0){
    document.getElementById('gridContainer').innerHTML = `<div class="empty"><i class="ti ti-inbox" style="font-size:36px"></i><br>ยังไม่มีจดหมายข่าวในหมวดนี้</div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.innerHTML = items.map(renderCard).join('');
  const c = document.getElementById('gridContainer');
  c.innerHTML=''; c.appendChild(grid);
}

function renderCard(item,idx){
  const cat = catColorMap[item.category] || {name:'',color:'#64748B'};
  let badge='';
  if(item.viewCount>=CONFIG.POPULAR_THRESHOLD) badge=`<span class="card-badge popular">⭐ ยอดนิยม</span>`;
  else if(item.viewCount>=CONFIG.HOT_THRESHOLD) badge=`<span class="card-badge hot">🔥 ฮอต</span>`;

  const cover = item.coverImageUrl
    ? `<img src="${item.coverImageUrl}" alt="" loading="lazy" style="object-position:${item.coverPos||'50% 50%'}">`
    : `<div style="font-size:26px;color:${cat.color}"><i class="ti ti-photo"></i></div>`;
  const bg = item.coverImageUrl?'':`background:${hexToTint(cat.color)}`;

  return `
  <div class="card" style="animation-delay:${(idx||0)*60}ms" onclick="openModal('${item.id}')">
    ${badge}
    <div class="card-cover" style="${bg}">
      ${cover}
      <span class="card-cat" style="color:${cat.color}">${cat.name}</span>
    </div>
    <div class="card-body">
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-excerpt">${esc(item.excerpt)}</div>
      <div class="card-meta"><span>${item.publishedAtThai}</span><span><i class="ti ti-eye"></i> ${item.viewCount}</span></div>
    </div>
  </div>`;
}

function renderPagination(pg){
  if(!pg || pg.totalPages<=1){ document.getElementById('paginationContainer').innerHTML=''; return; }
  let btns = '';
  btns += `<button class="pg-btn" ${!pg.hasPrev?'disabled':''} onclick="goPage(1)"><i class="ti ti-chevrons-left"></i></button>`;
  btns += `<button class="pg-btn" ${!pg.hasPrev?'disabled':''} onclick="goPage(${pg.currentPage-1})"><i class="ti ti-chevron-left"></i></button>`;

  // หมายเลขหน้า (แสดงรอบ ๆ หน้าปัจจุบัน)
  const range = pageRange(pg.currentPage, pg.totalPages);
  range.forEach(p=>{
    if(p==='...') btns+=`<span style="padding:0 4px;color:#94A3B8">...</span>`;
    else btns+=`<button class="pg-btn ${p===pg.currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });

  btns += `<button class="pg-btn" ${!pg.hasNext?'disabled':''} onclick="goPage(${pg.currentPage+1})"><i class="ti ti-chevron-right"></i></button>`;
  btns += `<button class="pg-btn" ${!pg.hasNext?'disabled':''} onclick="goPage(${pg.totalPages})"><i class="ti ti-chevrons-right"></i></button>`;
  document.getElementById('paginationContainer').innerHTML = `<div class="pagination">${btns}</div>`;
}

function pageRange(cur,total){
  const r=[]; const delta=1;
  for(let i=1;i<=total;i++){
    if(i===1||i===total||(i>=cur-delta&&i<=cur+delta)) r.push(i);
    else if(r[r.length-1]!=='...') r.push('...');
  }
  return r;
}

function updateToolbar(pg){
  const start=(pg.currentPage-1)*pg.pageSize+1;
  const end=Math.min(pg.currentPage*pg.pageSize, pg.totalItems);
  document.getElementById('toolbarInfo').innerHTML =
    pg.totalItems>0 ? `<i class="ti ti-news" style="color:var(--primary)"></i> แสดง <b>${start}-${end}</b> จากทั้งหมด <b>${pg.totalItems} ฉบับ</b>` : '';
}

// ============================================================
//  Modal
// ============================================================
async function openModal(id){
  const overlay=document.getElementById('modalOverlay');
  const box=document.getElementById('modalContent');
  box.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  overlay.classList.add('show');
  document.body.style.overflow='hidden';

  try{
    const r=await apiGet('get',{id:id,userAgent:navigator.userAgent.substr(0,100)});
    if(!r.success){ box.innerHTML=`<div class="empty">${r.error}</div>`; return; }
    box.innerHTML = renderModal(r.data);
  }catch(e){ box.innerHTML=`<div class="empty">โหลดไม่สำเร็จ</div>`; }
}

function renderModal(item){
  const cat=catColorMap[item.category]||{name:'',icon:''};
  const idx=State.currentList.findIndex(i=>i.id===item.id);
  const heroImg = item.coverImageUrl?`<img src="${item.coverImageUrl}" alt="" style="object-position:${item.coverPos||'50% 50%'}"><div class="modal-hero-overlay"></div>`:'<div class="modal-hero-overlay"></div>';

  // ===== ส่วนไฟล์แนบ (รูป + PDF) =====
  let filesHtml='';

  // รูปอินโฟกราฟิก (ถ้ามี) - แสดง preview คลิกดูใหญ่ + ปุ่มโหลด
  if(item.hasCover && item.coverImageUrl){
    filesHtml+=`
    <div class="modal-section-label"><i class="ti ti-photo" style="color:var(--primary)"></i> ภาพอินโฟกราฟิก</div>
    <div class="img-preview-box">
      <img src="${item.coverImageUrl}" alt="ภาพอินโฟกราฟิก" class="img-preview" onclick="openLightbox('${item.coverImageUrl}')">
      <div class="img-preview-hint"><i class="ti ti-zoom-in"></i> คลิกที่รูปเพื่อดูขนาดเต็ม</div>
      <button class="btn-sm btn-primary img-dl-btn" onclick="downloadCover('${item.id}','${item.coverDownloadUrl}',event)"><i class="ti ti-download"></i> ดาวน์โหลดรูป</button>
    </div>`;
  }

  // PDF (ถ้ามี) - กล่อง + viewer
  if(item.hasPdf){
    filesHtml+=`
    <div class="pdf-box">
      <div class="pdf-ico"><i class="ti ti-file-type-pdf"></i></div>
      <div class="pdf-info"><div class="pdf-name">${esc(item.pdfFileName||'เอกสาร.pdf')}</div><div class="pdf-size">${item.pdfFileSize}</div></div>
      <div class="pdf-actions"><button class="btn-sm btn-primary" onclick="downloadPdf('${item.id}',event)"><i class="ti ti-download"></i> ดาวน์โหลด PDF</button></div>
    </div>
    <div class="modal-section-label">ตัวอย่างเอกสาร</div>
    <iframe class="pdf-viewer" src="${item.pdfViewUrl}" loading="lazy"></iframe>`;
  }

  const tags=(item.tags||'').split(',').map(t=>t.trim()).filter(t=>t);
  const tagsHtml=tags.length?`<div class="modal-tags">${tags.map(t=>`<span class="tag"># ${esc(t)}</span>`).join('')}</div>`:'';

  // ===== แกลเลอรีรูปหลายรูป (รายละเอียดเพิ่มเติม) =====
  let galleryHtml='';
  if(item.gallery && item.gallery.length){
    const thumbs=item.gallery.map((g,i)=>
      `<div class="gallery-item" onclick="openLightbox('${g.full}')"><img src="${g.thumb}" alt="รูปที่ ${i+1}" loading="lazy"><div class="gallery-zoom"><i class="ti ti-zoom-in"></i></div></div>`
    ).join('');
    galleryHtml=`
    <div class="modal-section-label"><i class="ti ti-photo-scan" style="color:var(--primary)"></i> รายละเอียดเพิ่มเติม (${item.gallery.length} รูป)</div>
    <div class="gallery-grid">${thumbs}</div>`;
  }

  return `
  <div class="modal-close">
    <button onclick="shareItem('${item.id}')" title="แชร์"><i class="ti ti-share"></i></button>
    <button onclick="closeModal()" title="ปิด"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-hero">${heroImg}
    <div class="modal-hero-text">
      <div class="modal-hero-badge">${cat.icon} ${cat.name}</div>
      <div class="modal-hero-title display">${esc(item.title)}</div>
    </div>
  </div>
  <div class="modal-meta">
    <span><i class="ti ti-calendar" style="color:#3B82F6"></i> ${item.publishedAtThai}</span>
    <span><i class="ti ti-user" style="color:#10B981"></i> ${esc(item.createdBy||'-')}</span>
    <span><i class="ti ti-eye" style="color:#8B5CF6"></i> ${item.viewCount} ครั้ง</span>
    <span><i class="ti ti-download" style="color:#F59E0B"></i> ${item.downloadCount} ดาวน์โหลด</span>
  </div>
  <div class="modal-body">
    <div class="modal-content-text">${esc(item.content)}</div>
    ${filesHtml}
    ${galleryHtml}
    ${tagsHtml}
    <div class="modal-nav">
      <button ${idx<=0?'disabled':''} onclick="navModal(${idx-1})"><i class="ti ti-chevron-left"></i> ฉบับก่อนหน้า</button>
      <button ${idx>=State.currentList.length-1?'disabled':''} onclick="navModal(${idx+1})">ฉบับถัดไป <i class="ti ti-chevron-right"></i></button>
    </div>
  </div>`;
}

function navModal(idx){
  if(idx<0||idx>=State.currentList.length) return;
  openModal(State.currentList[idx].id);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow='';
}

async function downloadPdf(id,e){
  if(e) e.stopPropagation();
  try{
    const r=await apiGet('download',{id:id,userAgent:navigator.userAgent.substr(0,100)});
    if(r.success && r.downloadUrl){ window.open(r.downloadUrl,'_blank'); NL.toast('เริ่มดาวน์โหลดแล้ว'); }
    else NL.error(r.error||'ดาวน์โหลดไม่สำเร็จ');
  }catch(e){ NL.error('ดาวน์โหลดไม่สำเร็จ'); }
}

// ดาวน์โหลดรูปอินโฟกราฟิก
function downloadCover(id, url, e){
  if(e) e.stopPropagation();
  if(url) window.open(url,'_blank');
}

// เปิดดูรูปขนาดเต็ม (lightbox)
function openLightbox(url){
  const lb=document.getElementById('lightbox');
  document.getElementById('lightboxImg').src=url;
  lb.classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}

function shareItem(id){
  const url=window.location.origin+window.location.pathname+'?id='+id;
  if(navigator.share){ navigator.share({title:'จดหมายข่าว',url:url}); }
  else { navigator.clipboard.writeText(url); alert('คัดลอกลิงก์แล้ว!'); }
}

// ============================================================
//  Events
// ============================================================
function bindEvents(){
  // ค้นหา (debounce)
  let t;
  document.getElementById('searchBox').addEventListener('input',e=>{
    clearTimeout(t);
    t=setTimeout(()=>{ State.search=e.target.value; State.page=1; loadList(); },400);
  });
  // chip หมวดหมู่
  document.getElementById('categoryChips').addEventListener('click',e=>{
    const btn=e.target.closest('.chip'); if(!btn) return;
    State.category=btn.dataset.cat; State.page=1; renderChips(); loadList();
  });
  // sort
  document.getElementById('sortSelect').addEventListener('change',e=>{
    State.sort=e.target.value; State.page=1; loadList();
  });
  // ปิด modal เมื่อคลิกพื้นหลัง
  document.getElementById('modalOverlay').addEventListener('click',e=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
  // ESC ปิด modal
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

  // ถ้ามี ?id= ใน URL ให้เปิด modal ฉบับนั้นเลย (สำหรับ QR/แชร์)
  const params=new URLSearchParams(window.location.search);
  if(params.get('id')) openModal(params.get('id'));
}

function goPage(p){
  State.page=p; loadList();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
//  Utils
// ============================================================
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hexToTint(hex){
  // สร้าง gradient อ่อน ๆ จากสีหมวดหมู่
  const map={'#1E40AF':'linear-gradient(135deg,#DBEAFE,#93C5FD)','#059669':'linear-gradient(135deg,#D1FAE5,#6EE7B7)','#B45309':'linear-gradient(135deg,#FEF3C7,#FCD34D)','#BE185D':'linear-gradient(135deg,#FCE7F3,#F9A8D4)'};
  return map[hex]||'linear-gradient(135deg,#E2E8F0,#CBD5E1)';
}

// เริ่มทำงาน
init();
</script>
